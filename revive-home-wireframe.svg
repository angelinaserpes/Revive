<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #333; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #767676; }
      .line { stroke: #9b9b9b; stroke-width: 2; fill: none; }
      .fine { stroke: #b9b9b9; stroke-width: 1.5; fill: none; }
    </style>
    <clipPath id="heroClip">
      <rect x="28" y="114" width="1544" height="676" rx="16"/>
    </clipPath>
    <pattern id="imageGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dedede" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#f7f7f5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="88" fill="#fff" stroke="#c9c9c9"/>
  <circle cx="49" cy="44" r="19" fill="#e7e7e7" stroke="#8e8e8e" stroke-width="2"/>
  <path d="M41 48c8-13 16-12 19-11-1 10-7 17-17 17 3-6 7-10 13-14" class="fine"/>
  <text x="80" y="51" class="label" font-size="23" font-weight="700">Revive</text>

  <g class="label" font-size="15" text-anchor="middle">
    <text x="455" y="49">Shop</text>
    <text x="558" y="49">My Orders</text>
    <text x="682" y="49">Our Impact</text>
    <text x="810" y="49">Green Points</text>
    <text x="916" y="49">About</text>
  </g>
  <line x1="432" y1="62" x2="478" y2="62" stroke="#444" stroke-width="2"/>

  <rect x="1258" y="25" width="92" height="38" rx="19" fill="#ededed" stroke="#aaa"/>
  <circle cx="1280" cy="44" r="8" class="fine"/>
  <text x="1308" y="49" class="label" font-size="13" font-weight="700" text-anchor="middle">120 pts</text>

  <rect x="1364" y="25" width="142" height="38" rx="19" fill="#dedede" stroke="#8f8f8f"/>
  <circle cx="1387" cy="44" r="8" class="fine"/>
  <text x="1440" y="49" class="label" font-size="13" font-weight="700" text-anchor="middle">Recycle &amp; Earn</text>

  <rect x="1527" y="29" width="26" height="25" rx="5" class="line"/>
  <path d="M1533 36h14l-2 13h-10zM1536 36l2-5h4l2 5" class="fine"/>

  <!-- Hero -->
  <rect x="28" y="114" width="1544" height="676" rx="16" fill="url(#imageGrid)" stroke="#909090" stroke-width="2"/>
  <g clip-path="url(#heroClip)">
    <line x1="28" y1="114" x2="1572" y2="790" stroke="#c5c5c5" stroke-width="2"/>
    <line x1="1572" y1="114" x2="28" y2="790" stroke="#c5c5c5" stroke-width="2"/>
    <rect x="28" y="114" width="1544" height="676" fill="#d8d8d8" opacity=".32"/>
  </g>
  <rect x="635" y="220" width="330" height="34" rx="5" fill="#f1f1f1" stroke="#aaa"/>
  <text x="800" y="243" class="muted" font-size="16" letter-spacing="2" text-anchor="middle">HERO IMAGE PLACEHOLDER</text>

  <!-- Hero content -->
  <text x="800" y="390" class="label" font-size="54" text-anchor="middle">Revive</text>
  <text x="800" y="437" class="label" font-size="17" font-weight="700" letter-spacing="7" text-anchor="middle">GIVE THINGS A SECOND LIFE</text>
  <rect x="516" y="478" width="568" height="12" rx="6" fill="#aaa"/>
  <rect x="614" y="505" width="372" height="10" rx="5" fill="#b9b9b9"/>

  <text x="723" y="579" class="label" font-size="17" font-weight="700" text-anchor="middle">Shop Now</text>
  <line x1="687" y1="591" x2="759" y2="591" stroke="#555" stroke-width="2"/>
  <text x="890" y="579" class="label" font-size="17" font-weight="700" text-anchor="middle">Recycle &amp; Earn</text>
  <line x1="830" y1="591" x2="950" y2="591" stroke="#555" stroke-width="2"/>

  <!-- Overlapping scrolling strip -->
  <rect x="28" y="748" width="1544" height="124" rx="16" fill="#fff" stroke="#909090" stroke-width="2"/>
  <line x1="28" y1="812" x2="1572" y2="812" stroke="#e3e3e3"/>
  <g class="label" font-size="16" text-anchor="middle">
    <text x="138" y="791">Made in India</text>
    <circle cx="242" cy="786" r="5" class="fine"/>
    <text x="329" y="791">No plastic</text>
    <circle cx="415" cy="786" r="5" class="fine"/>
    <text x="534" y="791">Plant-based materials</text>
    <circle cx="672" cy="786" r="5" class="fine"/>
    <text x="758" y="791">Non-toxic</text>
    <circle cx="844" cy="786" r="5" class="fine"/>
    <text x="951" y="791">Doorstep pickup</text>
    <circle cx="1065" cy="786" r="5" class="fine"/>
    <text x="1190" y="791">Earn points per kilo</text>
    <circle cx="1325" cy="786" r="5" class="fine"/>
    <text x="1440" y="791">Made in India</text>
  </g>
  <g class="muted" font-size="13" text-anchor="middle">
    <text x="800" y="846">HORIZONTALLY SCROLLING SUSTAINABILITY CLAIMS</text>
  </g>

  <!-- Annotation ticks -->
  <path d="M28 100v-8M1572 100v-8M28 96h1544" class="fine"/>
  <text x="800" y="83" class="muted" font-size="12" text-anchor="middle">SAME CONTENT WIDTH</text>
</svg>
